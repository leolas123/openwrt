name: Build RE300 v1

on:
  push:
    branches: [re300-v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configuration
        run: |
          printf '%s\n' \
            'CONFIG_TARGET_ramips=y' \
            'CONFIG_TARGET_ramips_mt76x8=y' \
            'CONFIG_TARGET_ramips_mt76x8_DEVICE_tplink_re300-v1=y' \
            'CONFIG_PACKAGE_luci=y' > .config
          make defconfig
          grep -E "tplink_re300|PACKAGE_luci=" .config

      - name: Compilation
        run: |
          make download -j8
          make -j"$(nproc)" || make -j1 V=s

      - name: Images
        run: |
          ls -l bin/targets/ramips/mt76x8/ | grep -i re300
          sha256sum bin/targets/ramips/mt76x8/*re300* | tee re300-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: re300-v1-images
          path: |
            bin/targets/ramips/mt76x8/*re300*
            re300-sha256.txt
